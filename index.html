<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFE6E6">
<title>The Pookies List</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23E0483A' d='M16 28s-11-6.6-11-14.2C5 9.5 8.2 6.5 11.8 6.5c2 0 3.4 1 4.2 2.3.8-1.3 2.2-2.3 4.2-2.3C23.8 6.5 27 9.5 27 13.8 27 21.4 16 28 16 28z'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23FF4D6D'/%3E%3Cpath fill='%23fff' d='M16 26s-9-5.4-9-11.6C7 10.9 9.6 8.5 12.5 8.5c1.6 0 2.8.8 3.5 1.9.7-1.1 1.9-1.9 3.5-1.9 2.9 0 5.5 2.4 5.5 5.9C25 20.6 16 26 16 26z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: one column app, header + segmented tabs, list of cards per tab, bottom sheet for search/add */
:root{
  --bg:#FFE6E6; --surface:#FFFFFF; --ink:#7A1745; --muted:#B5577F; --line:#FFCCD9;
  --watch:#FF4D6D; --eat:#D63384; --idea:#F06292; --plan:#C2185B;
  --accent:var(--watch);
  --display:"Fredoka",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --radius:20px; color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body[data-tab="eat"]{--accent:var(--eat)} body[data-tab="idea"]{--accent:var(--idea)} body[data-tab="plan"]{--accent:var(--plan)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,7.5vw,44px);color:var(--eat);line-height:1;margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent);transition:color .2s}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}
.next{font-size:13px;color:var(--muted);text-align:right;min-width:0}
.next b{display:block;color:var(--ink);font-weight:600}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav button{font:600 14px var(--body);border:0;background:none;color:var(--muted);padding:9px 4px;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
nav button .n{font-size:11px;font-variant-numeric:tabular-nums;opacity:.7}
nav button[aria-selected="true"]{background:var(--accent);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar .grow{flex:1 1 200px;min-width:0}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:#FFF0F5;border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:64px}
.btn{font:700 15px var(--body);border:0;border-radius:25px;padding:10px 20px;transition:transform .2s,background .2s;cursor:pointer;background:var(--accent);color:#fff;white-space:nowrap}
.btn.ghost{background:#FFCCCC;color:var(--eat)}
.btn.ghost:hover{background:#FF99AA}
.btn.plain{background:none;color:var(--muted);padding:6px 8px}
.btn:hover:not(:disabled){transform:scale(1.06)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 11px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 16px rgba(214,51,132,.08);border-radius:var(--radius);padding:14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.item.has-poster{grid-template-columns:auto auto 1fr}
.item.done{opacity:.62}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);background:none;cursor:pointer;display:grid;place-items:center;color:#fff;padding:0;margin-top:1px}
.item.done .tick{background:var(--accent)}
.tick svg{width:14px;height:14px;opacity:0}
.item.done .tick svg{opacity:1}
.poster{width:64px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;flex:none;background:var(--line);position:relative}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster.gen{padding:7px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:linear-gradient(160deg,hsl(var(--h) 62% 46%),hsl(calc(var(--h) + 40) 70% 22%))}
.poster.gen b{font-family:var(--display);font-weight:800;font-size:10.5px;line-height:1.05;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.poster.gen i{font-style:normal;font-size:9px;opacity:.8;letter-spacing:.06em;text-transform:uppercase}
.body{min-width:0;display:flex;flex-direction:column;gap:4px}
.t{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;text-decoration-thickness:2px}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.desc{font-size:14px;overflow-wrap:anywhere}
.desc.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.acts{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;align-items:center}
.acts a,.acts button{font:500 13px var(--body);color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:none}
.acts .del{color:var(--muted);margin-left:auto}
.date{font-family:var(--display);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.empty{border:1.5px dashed var(--line);border-radius:var(--radius);padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:18px;margin-bottom:4px}
.scrim{position:fixed;inset:0;background:rgba(122,23,69,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:82%}}
.sheet h2{font-family:var(--display);font-size:22px;margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.result{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
.result.has-poster{grid-template-columns:auto 1fr}
.rb{min-width:0;display:flex;flex-direction:column;gap:4px}
.note{font-size:12.5px;color:var(--muted);margin:0}
.status{font-size:14px;color:var(--muted);padding:6px 0}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}h1 span{transition:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:14px;z-index:30}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.grid2{grid-template-columns:1fr} nav button .n{display:none}}
.wrap,.toast,.scrim{position:relative;z-index:2}
.scrim{position:fixed;z-index:20}.toast{position:fixed;z-index:30}
#fx{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.heart{position:absolute;font-size:1.6rem;animation:floatingHearts 6s ease-out forwards;opacity:.0}
@keyframes floatingHearts{0%{transform:translateY(0);opacity:.55}50%{opacity:.4}100%{transform:translateY(-300px);opacity:0}}
.sparkle{position:absolute;width:5px;height:5px;background:#fff;border-radius:50%;animation:sparkle 2.5s linear forwards}
@keyframes sparkle{0%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){#fx{display:none}}
</style>
</head>
<body data-tab="watch">
<div id="fx" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div>
      <h1>The Pookies <span>List</span></h1>
    </div>
    <div class="next" id="next" hidden></div>
  </header>

  <nav role="tablist" aria-label="Lists">
    <button role="tab" data-tab="watch" aria-selected="true">Watch <span class="n" id="n-watch"></span></button>
    <button role="tab" data-tab="eat" aria-selected="false">Eat <span class="n" id="n-eat"></span></button>
    <button role="tab" data-tab="idea" aria-selected="false">Ideas <span class="n" id="n-idea"></span></button>
    <button role="tab" data-tab="plan" aria-selected="false">Plans <span class="n" id="n-plan"></span></button>
  </nav>

  <div class="bar">
    <button class="btn" id="primary">Search movies &amp; TV</button>
    <button class="btn ghost" id="secondary">Add by hand</button>
  </div>

  <div class="seg" id="filters"></div>
  <div class="list" id="list" aria-live="polite"></div>
</div>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- config ---------- */
const SUPABASE_URL = "https://anuqikzewatebassozfh.supabase.co";
const SUPABASE_KEY = "sb_publishable_Oy3OaV9bDSfR8Ow5MESqCQ_vBuJkpYt"; // publishable, safe in the browser; RLS needs the private list key too
const CPH_BBOX = "55.60,12.45,55.73,12.65"; // south,west,north,east for Overpass

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };

/* list key arrives once via the link: …/#k=SECRET */
(function(){
  const m = location.hash.match(/k=([A-Za-z0-9_-]+)/), t = location.hash.match(/t=([A-Za-z0-9]+)/);
  if (m) store.set("pk-key", m[1]);
  if (t) store.set("pk-tmdb", t[1]);
  // Keep the keys in the address so "Add to Home Screen" saves a link that works on its own
  // (iPhone home-screen apps don't share storage with Safari).
  const k=store.get("pk-key"), tk=store.get("pk-tmdb");
  if (k){ const want="#k="+k+(tk?"&t="+tk:""); if (location.hash!==want) history.replaceState(null, "", location.pathname + location.search + want); }
})();
const LIST_KEY = store.get("pk-key");

const TABS = {
  watch:{primary:"Search movies & TV", filters:["To watch","Watched","All"], doneWord:"watched", empty:["Nothing on the watchlist yet","Search for a movie or show and add it here."]},
  eat:{primary:"Find a restaurant", filters:["To try","Been there","All"], doneWord:"been there", empty:["No restaurants saved yet","Search Copenhagen restaurants by name or cuisine."]},
  idea:{primary:"Get inspired", filters:["To do","Done","All"], doneWord:"done", empty:["No date ideas yet","Add your own, or tap Get inspired for some Copenhagen ideas."]},
  plan:{primary:"Add a plan", filters:["Upcoming","Past","All"], doneWord:"done", empty:["Nothing planned yet","Add a plan with a date, or turn any saved movie, restaurant or idea into one."]},
};

let state = { tab: TABS[store.get("pk-tab")] ? store.get("pk-tab") : "watch", filter:0, items:[], ready:false, err:null };

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(s,time){ if(!s) return ""; const d=new Date(s+"T12:00:00"); const out=d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}); return time? out+" · "+time : out; }

/* ---------- database (Supabase REST) ---------- */
async function api(path, opts={}){
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
    ...opts,
    headers: { "apikey": SUPABASE_KEY, "x-pookie-key": LIST_KEY || "", "Content-Type":"application/json", "Prefer":"return=representation", ...(opts.headers||{}) }
  });
  if(!res.ok){ const e=new Error("HTTP "+res.status); e.status=res.status; throw e; }
  return res.status===204 ? null : res.json();
}
const flat = r => ({ ...(r.data||{}), id:r.id, kind:r.kind, title:r.title, done:r.done, createdAt:r.created_at });
function split(d){ const {id,kind,title,done,createdAt,...rest}=d; return {kind,title,done,data:rest}; }

async function load(){
  if(!LIST_KEY){ state.err="nokey"; render(); return; }
  try{
    const rows = await api("items?select=*&order=created_at.desc");
    state.items = rows.map(flat); state.ready=true; state.err=null;
  }catch(e){ if(!state.ready) state.err = "load"; }
  render();
}
async function addItem(d){
  try{
    const [row] = await api("items",{method:"POST", body:JSON.stringify({...split({...d, done:false})})});
    state.items.unshift(flat(row)); render();
    toast("Added to "+({watch:"Watch",eat:"Eat",idea:"Ideas",plan:"Plans"})[d.kind]);
    if(d.kind==="watch" && d.lookup) setTimeout(enrich,0);
    return true;
  }catch(e){ toast("Couldn't save. Check your connection and try again."); return false; }
}
async function patchItem(it, changes){
  const next={...it, ...changes};
  const prev=state.items.slice();
  state.items=state.items.map(i=>i.id===it.id?next:i); render();
  try{ await api("items?id=eq."+encodeURIComponent(it.id),{method:"PATCH", body:JSON.stringify(split(next))}); return true; }
  catch(e){ state.items=prev; render(); toast("Couldn't save. Try again."); return false; }
}
async function deleteItem(it){
  const prev=state.items.slice();
  state.items=state.items.filter(i=>i.id!==it.id); render();
  try{ await api("items?id=eq."+encodeURIComponent(it.id),{method:"DELETE"}); toast("Removed"); }
  catch(e){ state.items=prev; render(); toast("Couldn't remove. Try again."); }
}

/* ---------- rendering ---------- */
function setTab(t){ state.tab=t; state.filter=0; store.set("pk-tab",t); render(); window.scrollTo({top:0}); }
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));

function visible(){
  const t=state.tab, f=state.filter;
  let xs=state.items.filter(i=>i.kind===t);
  if(t==="plan"){
    const td=today();
    if(f===0) xs=xs.filter(i=>!i.done && (i.date||"9999")>=td);
    if(f===1) xs=xs.filter(i=>i.done || (i.date && i.date<td));
    xs.sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999") * (f===1?-1:1));
  } else {
    if(f===0) xs=xs.filter(i=>!i.done);
    if(f===1) xs=xs.filter(i=>i.done);
  }
  return xs;
}

function posterHTML(title,year,type,src){
  let h=0; for(const c of String(title)) h=(h*31+c.charCodeAt(0))%360;
  const gen=`<div class="poster gen" style="--h:${h}" aria-hidden="true"><b>${esc(title)}</b><i>${esc([type==="tv"?"TV":"Film",String(year||"").slice(0,4)].filter(Boolean).join(" · "))}</i></div>`;
  if(!src) return gen;
  return `<div class="poster"><img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.outerHTML=this.parentNode.dataset.gen" ></div>`.replace('<div class="poster">',`<div class="poster" data-gen="${esc(gen)}">`);
}
function mapLink(i){ return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(i.title+" "+(i.address||"")+" København")}`; }

function itemHTML(i){
  const tw=TABS[i.kind];
  let meta=[], desc="", links="";
  if(i.kind==="watch"){ meta=[i.type==="tv"?"TV":"Movie", i.year, i.genre, i.length].filter(Boolean); desc=i.overview; }
  if(i.kind==="eat"){ meta=[i.cuisine, i.area].filter(Boolean); desc=[i.address, i.hours?("Open "+i.hours):""].filter(Boolean).join(" · ");
    links=`<a href="${mapLink(i)}" target="_blank" rel="noopener">Map &amp; reviews</a>${i.website?`<a href="${esc(i.website)}" target="_blank" rel="noopener">Website</a>`:""}`; }
  if(i.kind==="idea"){ meta=[i.cost, i.when].filter(Boolean); desc=i.notes; }
  if(i.kind==="plan"){ desc=i.notes; }
  if(i.note && i.kind!=="idea" && i.kind!=="plan") desc = desc ? desc+" — "+i.note : i.note;
  const date = i.kind==="plan" ? `<div class="date">${esc(i.date?fmtDate(i.date,i.time):"No date yet")}</div>` : "";
  const planBtn = i.kind!=="plan" ? `<button data-act="plan" data-id="${esc(i.id)}">Make it a plan</button>` : `<button data-act="edit" data-id="${esc(i.id)}">Edit</button>`;
  return `<div class="item${i.done?" done":""}${i.kind==="watch"?" has-poster":""}">
    <button class="tick" data-act="toggle" data-id="${esc(i.id)}" aria-label="${i.done?"Mark as not "+tw.doneWord:"Mark as "+tw.doneWord}">${CHECK}</button>${i.kind==="watch"?posterHTML(i.title,i.year,i.type,i.poster):""}
    <div class="body">${date}
      <div class="t">${esc(i.title)}</div>
      ${meta.length?`<div class="meta">${meta.map(m=>`<span>${esc(m)}</span>`).join("")}</div>`:""}
      ${desc?`<div class="desc${i.kind==="watch"?" clamp":""}">${esc(desc)}</div>`:""}
      <div class="acts">${links}${planBtn}<button class="del" data-act="del" data-id="${esc(i.id)}">Remove</button></div>
    </div></div>`;
}

function render(){
  document.body.dataset.tab=state.tab;
  const tw=TABS[state.tab];
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===state.tab));
  for(const k in TABS){ const n=state.items.filter(i=>i.kind===k && !i.done && (k!=="plan" || (i.date||"9999")>=today())).length; $("#n-"+k).textContent=n?n:""; }
  $("#primary").textContent=tw.primary;
  $("#secondary").hidden = state.tab==="plan";
  $("#filters").innerHTML=tw.filters.map((f,ix)=>`<button class="chip" aria-pressed="${ix===state.filter}" data-f="${ix}">${f}</button>`).join("");
  const next=state.items.filter(i=>i.kind==="plan"&&!i.done&&i.date&&i.date>=today()).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const nx=$("#next"); nx.hidden=!next; if(next) nx.innerHTML=`Next up<b>${esc(next.title)}</b>${esc(fmtDate(next.date,next.time))}`;
  const L=$("#list");
  if(state.err==="nokey"){ L.innerHTML=`<div class="empty"><b>Paste your private link</b>This site only shows your list with your private link. Paste it here once and this phone remembers it.
    <form id="keyf" class="bar" style="margin-top:12px"><input class="grow" id="keyin" placeholder="https://lucas09.github.io/pookies/#k=…" autocomplete="off"><button class="btn">Open</button></form></div>`;
    $("#keyf").onsubmit=e=>{ e.preventDefault(); const v=$("#keyin").value; const m=v.match(/k=([A-Za-z0-9_-]+)/), t=v.match(/t=([A-Za-z0-9]+)/);
      if(!m){ toast("That doesn't look like the private link"); return; }
      store.set("pk-key",m[1]); if(t) store.set("pk-tmdb",t[1]); location.replace(location.pathname+"#k="+m[1]+(t?"&t="+t[1]:"")); location.reload(); };
    return; }
  if(state.err==="load"){ L.innerHTML=`<div class="empty"><b>Couldn't load your lists</b>Check your connection, then pull to refresh or reopen the page.</div>`; return; }
  if(!state.ready){ L.innerHTML=`<div class="status"><span class="spin"></span>Loading your lists…</div>`; return; }
  const xs=visible();
  if(!xs.length){
    const any=state.items.some(i=>i.kind===state.tab);

/* ---------- movies & TV: Apple iTunes (movies) + TVmaze (TV), no keys ---------- */
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb="pk_cb_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    const done=()=>{ delete window[cb]; s.remove(); clearTimeout(t); };
    const t=setTimeout(()=>{ done(); reject(new Error("timeout")); },10000);
    window[cb]=d=>{ done(); resolve(d); };
    s.onerror=()=>{ done(); reject(new Error("load")); };
    s.src=url+(url.includes("?")?"&":"?")+"callback="+cb;
    document.head.appendChild(s);
  });
}
const strip = h => { const d=document.createElement("div"); d.innerHTML=String(h||"").replace(/<[^>]*>/g," "); return d.textContent.replace(/\s+/g," ").trim(); };
async function searchMovies(q){
  // Look in both the Danish and US stores (new films often reach one first), take many results, then rank.
  const urls=["dk","us"].map(c=>`https://itunes.apple.com/search?media=movie&entity=movie&country=${c}&limit=50&term=${encodeURIComponent(q)}`);
  const got=await Promise.allSettled(urls.map(jsonp));
  if(got.every(g=>g.status==="rejected")) throw new Error("itunes");
  const seen=new Set(), all=[];
  for(const g of got) if(g.status==="fulfilled") for(const r of (g.value.results||[])){ const k=(r.trackName||"").toLowerCase()+"|"+(r.releaseDate||"").slice(0,4); if(!seen.has(k)){ seen.add(k); all.push(r); } }
  const ql=q.toLowerCase().trim(), score=r=>{ const t=(r.trackName||"").toLowerCase(); return t===ql?3 : t.startsWith(ql)?2 : t.includes(ql)?1 : 0; };
  all.sort((a,b)=>score(b)-score(a) || (b.releaseDate||"").localeCompare(a.releaseDate||""));
  return all.slice(0,10).map(r=>({
    title:r.trackName, type:"movie", year:(r.releaseDate||"").slice(0,4), genre:r.primaryGenreName||"",
    length: r.trackTimeMillis ? Math.floor(r.trackTimeMillis/3600000)+"h "+Math.round(r.trackTimeMillis/60000%60)+"m" : "",
    overview: r.longDescription||r.shortDescription||"", people: r.artistName ? "Directed by "+r.artistName : "",
    poster: r.artworkUrl100 ? r.artworkUrl100.replace(/\/\d+x\d+bb\./,"/400x600bb.") : ""
  }));
}
async function searchTV(q){
  const res = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(q)}`);
  if(!res.ok) throw new Error("tv");
  const d = await res.json();
  return d.slice(0,8).map(({show:s})=>({
    title:s.name, type:"tv", year:(s.premiered||"").slice(0,4)+(s.ended?"–"+s.ended.slice(0,4):(s.status==="Running"?"–":"")),
    genre:(s.genres||[]).slice(0,2).join(", "), length: s.network?.name || s.webChannel?.name || "",
    overview: strip(s.summary), people:"", poster: s.image ? (s.image.original||s.image.medium).replace(/^http:/,"https:") : ""
  }));
}

/* ---------- TMDB (used when a key is set; covers almost every film and show) ---------- */
const TMDB_KEY = store.get("pk-tmdb") || ""; // arrives via the private link (#…&t=KEY), never stored in the repo
const TMDB_IMG = "https://image.tmdb.org/t/p/w342";
const TMDB_GENRES = {28:"Action",12:"Adventure",16:"Animation",35:"Comedy",80:"Crime",99:"Documentary",18:"Drama",10751:"Family",14:"Fantasy",36:"History",27:"Horror",10402:"Music",9648:"Mystery",10749:"Romance",878:"Sci-Fi",10770:"TV Movie",53:"Thriller",10752:"War",37:"Western",10759:"Action & Adventure",10762:"Kids",10763:"News",10764:"Reality",10765:"Sci-Fi & Fantasy",10766:"Soap",10767:"Talk",10768:"War & Politics"};
async function tmdb(path, params={}){
  const u=new URL("https://api.themoviedb.org/3/"+path);
  u.searchParams.set("api_key",TMDB_KEY); u.searchParams.set("include_adult","false");
  for(const k in params) if(params[k]) u.searchParams.set(k,params[k]);
  const r=await fetch(u); if(!r.ok) throw new Error("tmdb "+r.status); return r.json();
}
function fromTmdb(r,type){
  const tv = type==="tv";
  const date = tv ? r.first_air_date : r.release_date;
  return { title: tv ? r.name : r.title, type: tv?"tv":"movie", year:(date||"").slice(0,4),
    genre:(r.genre_ids||[]).slice(0,2).map(g=>TMDB_GENRES[g]).filter(Boolean).join(", "), length:"",
    overview:r.overview||"", people:"", poster:r.poster_path?TMDB_IMG+r.poster_path:"", tmdb:r.id };
}
async function tmdbSearch(q, which){
  if(which==="movie") return (await tmdb("search/movie",{query:q})).results.slice(0,12).map(r=>fromTmdb(r,"movie"));
  if(which==="tv") return (await tmdb("search/tv",{query:q})).results.slice(0,12).map(r=>fromTmdb(r,"tv"));
  const d=await tmdb("search/multi",{query:q});
  return d.results.filter(r=>r.media_type==="movie"||r.media_type==="tv").slice(0,12).map(r=>fromTmdb(r,r.media_type));
}

/* ---------- restaurants: OpenStreetMap via Overpass, no keys ---------- */
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\"]/g,"\\$&");
async function searchPlaces(q){
  const r = reEsc(q);
  const query = `[out:json][timeout:20];(nwr["amenity"~"^(restaurant|cafe|bar|pub|fast_food|ice_cream)$"]["name"~"${r}",i](${CPH_BBOX});nwr["amenity"~"^(restaurant|cafe|bar)$"]["cuisine"~"${r}",i](${CPH_BBOX}););out center tags 40;`;
  const res = await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(query),headers:{"Content-Type":"application/x-www-form-urlencoded"}});
  if(!res.ok) throw new Error("osm");
  const d = await res.json();
  const seen=new Set();
  return (d.elements||[]).filter(e=>e.tags&&e.tags.name).map(e=>{ const t=e.tags;
    const cuisine=(t.cuisine||"").split(";").map(c=>c.replace(/_/g," ")).filter(Boolean).slice(0,3).join(", ");
    const kind={cafe:"Café",bar:"Bar",pub:"Pub",fast_food:"Fast food",ice_cream:"Ice cream"}[t.amenity];
    return { name:t.name, cuisine:[kind,cuisine].filter(Boolean).join(" · ") || "Restaurant",
      address:[ [t["addr:street"],t["addr:housenumber"]].filter(Boolean).join(" "), t["addr:postcode"] ].filter(Boolean).join(", "),
      area: t["addr:city"] && t["addr:city"]!=="København" ? t["addr:city"] : "",
      hours:t.opening_hours||"", website:t.website||t["contact:website"]||"", phone:t.phone||t["contact:phone"]||"",
      lat:e.lat||e.center?.lat, lon:e.lon||e.center?.lon };
  }).filter(p=>{ const k=p.name+"|"+p.address; if(seen.has(k)) return false; seen.add(k); return true; })
    .sort((a,b)=>(b.name.toLowerCase().includes(q.toLowerCase()))-(a.name.toLowerCase().includes(q.toLowerCase()))).slice(0,20);
}
function openEatSearch(){
  openSheet(`${head("Find a restaurant")}
    <form id="sf" class="bar"><input class="grow" id="sq" placeholder="Name or cuisine, e.g. “Barr” or “ramen”" autocomplete="off" enterkeyhint="search"><button class="btn">Search</button></form>

    if(seq!==searchSeq) return;

    $("#results").innerHTML=resultsHTML(arr,r=>({title:r.name, meta:[r.cuisine,r.area].filter(Boolean), desc:[r.address, r.hours?("Open "+r.hours):""].filter(Boolean).join(" · "),

    wireAdds(arr,r=>({kind:"eat",title:r.name,cuisine:r.cuisine,area:r.area,address:r.address,hours:r.hours,website:r.website,phone:r.phone,lat:r.lat,lon:r.lon}));

async function seedIfNeeded(){
  if(state.items.some(i=>i.kind==="meta" && i.title===SEED_TAG)) return false;
  try{
    const marks = await api(`items?select=id&kind=eq.meta&title=eq.${SEED_TAG}`);
    if(marks.length) return false;
    await api("items",{method:"POST",body:JSON.stringify({kind:"meta",title:SEED_TAG,done:true,data:{}})});
    const now=Date.now();
    const have=new Set(state.items.map(i=>i.kind+"|"+i.title.toLowerCase()));
    const rows = SEED.filter(d=>!have.has(d.kind+"|"+d.title.toLowerCase())).reverse().map((d,ix)=>{ const {done=false,...rest}=d; return {...split({...rest,done}), created_at:new Date(now+ix*1000).toISOString()}; });
    await api("items",{method:"POST",body:JSON.stringify(rows)});
    return true;
  }catch(e){ return false; }
}

/* ---------- fill in posters and info for titles added without them ---------- */
let enriching=false;
async function lookupOne(it){
  const q = it.q || it.title;
  if(TMDB_KEY){
    try{
      const tv=it.type==="tv";
      const d=await tmdb(tv?"search/tv":"search/movie",{query:it.title, [tv?"first_air_date_year":"year"]:it.y||""});
      let r=d.results[0];
      if(!r && it.y){ r=(await tmdb(tv?"search/tv":"search/movie",{query:it.title})).results[0]; }
      if(r){ const x=fromTmdb(r,tv?"tv":"movie"); return {year:it.year||x.year, genre:x.genre||it.genre||"", overview:x.overview.slice(0,600)||it.overview||"", poster:x.poster, tmdb:x.tmdb}; }
    }catch(e){}
  }
  if(it.type==="tv"){
    const r = await fetch(`https://api.tvmaze.com/singlesearch/shows?q=${encodeURIComponent(q)}`);
    if(!r.ok) return null;
    const s = await r.json();
    return { year:(s.premiered||"").slice(0,4)+(s.ended?"–"+s.ended.slice(0,4):(s.status==="Running"?"–":"")), genre:(s.genres||[]).slice(0,2).join(", "),
      length:s.network?.name||s.webChannel?.name||"", overview:strip(s.summary).slice(0,600), poster:s.image?(s.image.original||s.image.medium).replace(/^http:/,"https:"):"" };
  }
  const xs = await searchMovies(q);
  const m = xs.find(x=>it.y && x.year===it.y) || (it.y ? xs.find(x=>Math.abs(+x.year - +it.y)<=1) : xs[0]);
  if(!m) return null;
  return { year:m.year, genre:m.genre, length:m.length, overview:m.overview.slice(0,600), poster:m.poster };
}
async function enrich(){
  if(enriching) return; enriching=true;
  try{
    for(const it of state.items.filter(i=>i.kind==="watch" && i.lookup && (!i.looked || (!i.poster && !i.looked2) || (TMDB_KEY && !i.poster && !i.lookedT)))){
      let info=null; try{ info=await lookupOne(it); }catch(e){}
      const cur=state.items.find(i=>i.id===it.id); if(!cur) continue;
      const next={...cur, ...(info||{}), looked:true, looked2:true, ...(TMDB_KEY?{lookedT:true}:{})};
      state.items=state.items.map(i=>i.id===it.id?next:i);
      try{ await api("items?id=eq."+encodeURIComponent(it.id),{method:"PATCH",body:JSON.stringify(split(next))}); }catch(e){}
      render();
      await new Promise(r=>setTimeout(r,350));
    }
  } finally { enriching=false; }
}

/* ---------- hearts & sparkles (from the valentine page) ---------- */
(function(){
  const fx=document.getElementById("fx");
  function spawn(cls,html,life){ if(document.hidden) return; const el=document.createElement("div"); el.className=cls; if(html) el.textContent=html;
    el.style.left=Math.random()*100+"vw"; el.style.top=(cls==="heart"?40+Math.random()*70:Math.random()*100)+"vh";
    if(cls==="heart") el.style.animationDuration=(Math.random()*3+4)+"s";
    fx.appendChild(el); setTimeout(()=>el.remove(),life); }
  setInterval(()=>spawn("heart","❤️",7000),1400);
  setInterval(()=>spawn("sparkle","",3000),700);
})();

/* ---------- boot ---------- */
render();
load().then(async()=>{ if(state.ready && await seedIfNeeded()) await load(); if(state.ready) enrich(); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(); });
setInterval(()=>{ if(!document.hidden && $("#scrim").hidden) load(); },30000);
</script>
